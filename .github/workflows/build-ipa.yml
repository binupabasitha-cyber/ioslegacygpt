name: Build unsigned IPA (arm64)
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project ChatGPT.xcodeproj -target ChatGPT -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload && cp -R build/Release-iphoneos/ChatGPT.app Payload/
          zip -qr ChatGPT-arm64-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-arm64-unsigned
          path: ChatGPT-arm64-unsigned.ipa
